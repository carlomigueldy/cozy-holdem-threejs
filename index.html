<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#20130d" />
    <title>Hearthside Hold'em — Cozy 3D Poker</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="3D poker table"></canvas>
      <section id="hud" aria-live="polite">
        <header class="topbar">
          <div>
            <p class="eyebrow">Three.js Texas Hold'em</p>
            <h1>Hearthside Hold'em</h1>
          </div>
          <div class="badge" id="roundBadge">Loading table…</div>
        </header>

        <aside class="status-card" id="statusPanel">
          <div class="status-row"><span>Pot</span><strong id="potText">—</strong></div>
          <div class="status-row"><span>Your stack</span><strong id="stackText">—</strong></div>
          <div class="status-row"><span>To call</span><strong id="toCallText">—</strong></div>
          <div class="status-row"><span>Best hand</span><strong id="bestHandText">—</strong></div>
          <p class="message" id="messageText">Pull up a chair by the fire.</p>
        </aside>

        <aside class="players-card" id="playersPanel" aria-label="Player stacks and statuses"></aside>

        <div class="action-bar" role="group" aria-label="Poker actions">
          <button id="foldBtn" class="danger">Fold</button>
          <button id="callBtn">Check / Call</button>
          <label class="raise-control">
            <span id="raiseLabel">Raise</span>
            <input id="raiseSlider" type="range" min="20" max="300" step="10" value="60" />
          </label>
          <button id="raiseBtn" class="primary">Bet / Raise</button>
          <button id="newHandBtn" class="secondary">New Hand</button>
        </div>

        <div class="toast" id="toastText">Welcome to Hearthside Hold'em</div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
