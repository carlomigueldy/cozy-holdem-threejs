<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#20130d" />
    <title>Hearthside Hold'em — Cozy 3D Poker</title>

    <style>
      .site-attribution {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        padding: 0.48rem 0.72rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        background: rgba(8, 10, 18, 0.72);
        color: #fff;
        font: 700 12px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      .site-attribution:hover,
      .site-attribution:focus-visible {
        transform: translateY(-1px);
        background: rgba(16, 20, 34, 0.86);
        outline: 2px solid rgba(255, 255, 255, 0.36);
        outline-offset: 2px;
      }

      @media (max-width: 640px) {
        .site-attribution {
          right: max(10px, env(safe-area-inset-right));
          bottom: max(10px, env(safe-area-inset-bottom));
          padding: 0.42rem 0.62rem;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="3D poker table"></canvas>
      <section id="hud" aria-live="polite">
        <header class="topbar">
          <div>
            <p class="eyebrow">Three.js Texas Hold'em</p>
            <h1>Hearthside Hold'em</h1>
          </div>
          <div class="badge" id="roundBadge">Loading table…</div>
        </header>

        <aside class="status-card" id="statusPanel">
          <div class="status-row"><span>Pot</span><strong id="potText">—</strong></div>
          <div class="status-row"><span>Your stack</span><strong id="stackText">—</strong></div>
          <div class="status-row"><span>To call</span><strong id="toCallText">—</strong></div>
          <div class="status-row"><span>Best hand</span><strong id="bestHandText">—</strong></div>
          <p class="message" id="messageText">Pull up a chair by the fire.</p>
        </aside>

        <aside class="players-card" id="playersPanel" aria-label="Player stacks and statuses"></aside>

        <div class="action-bar" role="group" aria-label="Poker actions">
          <button id="foldBtn" class="danger">Fold</button>
          <button id="callBtn">Check / Call</button>
          <label class="raise-control">
            <span id="raiseLabel">Raise</span>
            <input id="raiseSlider" type="range" min="20" max="300" step="10" value="60" />
          </label>
          <button id="raiseBtn" class="primary">Bet / Raise</button>
          <button id="newHandBtn" class="secondary">New Hand</button>
        </div>

        <div class="toast" id="toastText">Welcome to Hearthside Hold'em</div>
      </section>
    </div>

    <a
      class="site-attribution"
      href="https://carlomigueldy.dev"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit carlomigueldy.dev"
    >carlomigueldy.dev</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
